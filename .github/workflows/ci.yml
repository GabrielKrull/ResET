name: ResET CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: reset
          POSTGRES_PASSWORD: reset_secret
          POSTGRES_DB: reset_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Code format check
        run: npm run format:check

      - name: Lint check
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run automated tests
        env:
          DATABASE_URL: postgresql://reset:reset_secret@localhost:5432/reset_db
          NODE_ENV: test
        run: npm test

      - name: Build server & frontend
        run: |
          npm run build:server
          npm run build:desktop

