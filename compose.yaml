services:
  postgres:
    image: postgres:17-alpine
    container_name: reset-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "5432:5432"
    volumes:
      - reset_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reset} -d ${POSTGRES_DB:-reset_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  migration:
    profiles: ["migration"]
    image: reset-server
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: reset-migration
    command: ["node", "apps/server/dist/database/migrate.js"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${COMPOSE_DATABASE_URL:?Set COMPOSE_DATABASE_URL for the Compose network in .env}

  server:
    image: reset-server
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: reset-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: ${COMPOSE_DATABASE_URL:?Set COMPOSE_DATABASE_URL for the Compose network in .env}
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  reset_postgres_data:
    name: reset_postgres_data

